[package]
name = "flowcam"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
# RTSP keyframe grabber for the Buddy3D camera. Unlike the other crates in this
# workspace this one cannot be dependency-free -- nobody hand-rolls an H.264
# decoder. openh264 compiles Cisco's decoder from vendored C source, so there is
# still no system package (no ffmpeg, no pkg-config) required to build or run.

[dependencies]
retina = "0.4"
openh264 = "0.9"
jpeg-encoder = "0.7"
mp4 = "0.14"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
futures = "0.3"
url = "2"
