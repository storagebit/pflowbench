# =============================================================================
# PrusaSlicer Config Bundle
#
#   Filament : Elegoo PLA-CF (carbon-fibre filled PLA, 1.75 mm)
#   Printer  : Prusa CORE One / CORE One L
#   Nozzles  : TWO profiles, one per nozzle --
#                A) E3D High Flow ObXidian 0.6  (tool steel + E3DLC, HF geometry)
#                B) E3D DiamondBack 0.6         (PCD tip, STANDARD geometry)
#   Print    : 0.25 mm layer, quality-biased  (42 % layer-to-nozzle ratio)
#
# IMPORT:   PrusaSlicer -> File -> Import -> Import Config Bundle...
# REQUIRES: PrusaSlicer 2.9.x+
#
# The four presets are gated on nozzle_high_flow, so PrusaSlicer will only offer
# you the matching pair once you select the printer preset. You cannot cross
# them by accident.
#     ObXidian  ->  "Prusa CORE One HF0.6 nozzle"   (nozzle_high_flow = 1)
#     DiamondBack -> "Prusa CORE One 0.6 nozzle"    (nozzle_high_flow = 0)
#
#
# =============================================================================
# THE HEADLINE: THESE TWO NOZZLES ARE NOT INTERCHANGEABLE AT 0.6
# =============================================================================
#
# At 0.8 the two were close, because a 0.8 orifice is already large enough that
# geometry matters less. At 0.6 they are almost 2:1 apart on flow.
#
#   E3D published max volumetric flow, HF ObXidian 0.6, PLA @ 220 C ... 30 mm3/s
#   Prusa's shipped MVS, "Elegoo PLA @COREONE HF0.6" ................. 30 mm3/s
#   Prusa's shipped MVS, "Elegoo PLA @COREONE 0.6"  (standard flow) . 15.5 mm3/s
#
# Two independent sources agree on 30 for the HF. E3D publishes NO flow table
# for the DiamondBack Nextruder nozzle at all -- only for its HF products --
# which is consistent with it being a standard-flow part whose value is wear
# resistance and tip finish, not throughput.
#
# WHY, MECHANICALLY
#   Melting power is not the constraint. Budget for PLA, rho 1.24 g/cm3,
#   cp ~1.9 J/(g K), dT 195 K, ~20 J/g enthalpy of fusion, against the
#   Nextruder's 24 V 40 W cartridge:
#       14 mm3/s ->  6.8 W  (17 % of the heater)
#       27 mm3/s -> 13.1 W  (33 %)
#       30 mm3/s -> 14.5 W  (36 %)
#   There is plenty of wattage at every flow rate either nozzle can reach.
#
#   The constraint is heat TRANSFER RATE into the polymer. PLA conducts heat at
#   roughly 0.13-0.19 W/(m K) -- it is nearly an insulator, so the melt front
#   advances slowly from the wall inward. The only levers are contact surface
#   area and melt-zone dwell time. That is precisely what E3D's HF internal
#   geometry buys, and it is why nozzle geometry rather than heater wattage
#   sets MVS.
#
#   The DiamondBack's PCD tip does conduct extremely well, but it is a tip
#   insert. It keeps the last fraction of a millimetre hot and gives the
#   ironing-like top surface -- it does not lengthen or restructure the melt
#   zone, so it does not move MVS much. Expect a standard-flow number.
#
#   One thing that helps CF specifically: carbon fibre conducts heat far better
#   than the PLA around it, so CF-PLA takes heat up somewhat faster than neat
#   PLA. That partly offsets its higher melt viscosity. It does not fully
#   offset it -- hence the ~10 % derate applied to both MVS values below.
#
#
# =============================================================================
# WHERE MVS ACTUALLY BINDS  (this is the part that changes how you slice)
# =============================================================================
#
# PrusaSlicer models a bead as a rectangle with semicircular ends:
#     A = w*h - h^2*(1 - pi/4)
# At 0.25 mm layer and the stock 0.68 mm width that is 0.1566 mm2, so:
#
#     speed to saturate MVS = MVS / 0.1566
#
#   layer     HF ObXidian (cap 27)      DiamondBack (cap 14)
#   -----     --------------------      --------------------
#   0.20 mm        212 mm/s                  110 mm/s
#   0.25 mm        172 mm/s                   89 mm/s
#   0.32 mm        138 mm/s                   72 mm/s
#   0.40 mm        114 mm/s                   59 mm/s
#
# THE PRACTICAL CONSEQUENCE, and the reason the two print profiles below are
# shaped differently:
#
#   Prusa's stock "0.25mm SPEED @COREONE 0.6" asks for infill_speed = 140.
#   On a standard-flow nozzle that is fiction -- MVS silently throttles it to
#   89 mm/s, 64 % of the number in the box. Its solid_infill 90 and perimeter 95
#   are also clipped. The DiamondBack profile below therefore sets infill to 85,
#   just under the real ceiling, so every speed in the preset is a speed the
#   printer will actually run and the time estimate means something.
#
#   The ObXidian profile does the opposite: it slows the EXTERNAL perimeter hard
#   for looks (100 mm/s vs Prusa's 180) while leaving infill at 150 mm/s, which
#   is 87 % of the 27 mm3/s cap. That is where a high-flow nozzle actually pays
#   -- interior volume -- and it costs nothing visible.
#
#
# =============================================================================
# WHAT TO EXPECT IN PRACTICE
# =============================================================================
#   Same part, same 0.25 mm layer: the ObXidian will finish materially faster,
#   and the gap widens as the part gets bulkier (more infill, more solid layers)
#   and narrows to almost nothing on small, detail-heavy parts where the tool
#   never reaches commanded speed anyway.
#
#   Quality at equal speed should be a wash. Below ~14 mm3/s both nozzles are
#   operating well inside their envelope and neither is the limiting factor.
#   Where the DiamondBack wins is the top surface -- the polished PCD flat
#   irons as it passes -- and nozzle life, which on CF is the whole point.
#
#   If you mostly print CF and mostly print functional parts: DiamondBack.
#   If you print big CF parts and care about wall-clock time: ObXidian, and
#   accept that you will be replacing it long before the DiamondBack wears.
#
#
# =============================================================================
# NOTES CARRIED FORWARD FROM THE 0.8 PROFILE (still true)
# =============================================================================
#   * Pressure advance on CORE One is  M572 S<val>,  NOT  M900 K<val>. Prusa
#     routes MK4IS/XLIS/MK4S/MK3.9S/COREONE to the M572 branch. The two are on
#     different numeric scales -- a K value copied from an MK3-era profile is
#     wrong even though the command is accepted.
#   * M142 S36 sets the heatbreak target temperature. Prusa sets it on every
#     CORE One PLA profile. Any custom start_filament_gcode that omits it
#     removes heatbreak thermal regulation and invites heat creep. Keep it.
#   * chamber_minimal_temperature = 0 makes the start G-code emit "M870 O",
#     i.e. VENT FLAP OPEN. Mandatory for PLA in the enclosure.
#   * Prusa uses the same PA value, 0.014, for a 0.6 nozzle in BOTH the HF and
#     standard branches. Nozzle diameter drives PA; HF geometry does not.
# =============================================================================


# #############################################################################
# ##  A)  HIGH FLOW ObXIDIAN 0.6                                             ##
# #############################################################################

# -----------------------------------------------------------------------------
# PRINT -- base: Prusa "0.25mm BALANCED @COREONE HF0.6"
# Strategy: slow externals for looks, keep interior fast. High flow earns its
# money on infill and solid infill, which nobody looks at.
# -----------------------------------------------------------------------------
[print:0.25mm QUALITY HFOBX06 CF @COREONE]
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.6 and nozzle_high_flow[0]

# --- layers & shells ---------------------------------------------------------
layer_height = 0.25
first_layer_height = 0.2
perimeters = 3
# [DELTA] stock 2. 3 x 0.68 = 2.04 mm shell. CF-PLA is stiff but brittle;
# walls carry load far better than infill density does.
top_solid_layers = 4
bottom_solid_layers = 3
top_solid_min_thickness = 0.9
bottom_solid_min_thickness = 0.7
perimeter_generator = arachne
ensure_vertical_shell_thickness = 1
seam_position = aligned
staggered_inner_seams = 1
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
overhangs = 1
gap_fill_enabled = 1
avoid_crossing_perimeters = 0

# --- infill ------------------------------------------------------------------
fill_density = 20%
fill_pattern = gyroid
# [DELTA] stock grid. At 5000 mm/s2 infill accel, gyroid's continuous curvature
# holds melt pressure steadier than grid's full stop at every crossing. Also
# isotropic, which suits CF's anisotropy. Grid crossings on a filled material
# are also where you get the most nozzle-strike noise.
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
solid_infill_every_layers = 0
infill_anchor = 2.5
infill_anchor_max = 20
solid_infill_below_area = 0

# --- extrusion widths --------------------------------------------------------
extrusion_width = 0.68
first_layer_extrusion_width = 0.68
perimeter_extrusion_width = 0.68
external_perimeter_extrusion_width = 0.64
# [DELTA] stock 0.68. 1.07x nozzle instead of 1.13x -- crisper corners, tighter
# outside dimensions. Prusa itself narrows this to 0.62 in its 0.20mm
# STRUCTURAL 0.6 profile, so the idea is theirs, not mine. If you see starved
# corners or gaps against the second perimeter, put it back to 0.68.
infill_extrusion_width = 0.68
solid_infill_extrusion_width = 0.68
top_infill_extrusion_width = 0.55
support_material_extrusion_width = 0.5

# --- speeds (mm/s) -----------------------------------------------------------
# Bead areas at 0.25 mm layer: w0.68 -> 0.1566 | w0.64 -> 0.1466 | w0.55 -> 0.1241
# Against the 27 mm3/s cap:
#   external perim  100 x 0.1466 = 14.7 mm3/s   54 % of cap
#   perimeter       130 x 0.1566 = 20.4 mm3/s   75 %
#   infill          150 x 0.1566 = 23.5 mm3/s   87 %   <-- the payoff
#   solid infill    130 x 0.1566 = 20.4 mm3/s   75 %
#   top solid        50 x 0.1241 =  6.2 mm3/s   23 %
# Nothing is throttled. Every number below is a speed the printer will run.
perimeter_speed = 130
external_perimeter_speed = 100
# [DELTA] stock 180. Prusa runs external FASTER than internal in its BALANCED
# tier; that is a speed choice, not a quality one. This is the single biggest
# visual lever in the file.
small_perimeter_speed = 90
infill_speed = 150
solid_infill_speed = 130
top_solid_infill_speed = 50
# [DELTA] stock 60.
first_layer_infill_speed = 70
gap_fill_speed = 70
bridge_speed = 30
support_material_speed = 60
support_material_interface_speed = 85%
travel_speed = 350
travel_speed_z = 12
first_layer_speed = 35
# [DELTA] stock 45. CF on glue-sticked smooth PEI; a slow first layer is cheap.
first_layer_speed_over_raft = 30
max_print_speed = 300

# --- dynamic overhang speeds -------------------------------------------------
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 15
overhang_speed_1 = 20
overhang_speed_2 = 30
overhang_speed_3 = 70%

# --- acceleration ------------------------------------------------------------
default_acceleration = 3000
perimeter_acceleration = 3000
external_perimeter_acceleration = 1800
# [DELTA] stock 2500.
infill_acceleration = 5000
solid_infill_acceleration = 5000
top_solid_infill_acceleration = 2000
bridge_acceleration = 1500
first_layer_acceleration = 500
travel_acceleration = 7000

# --- bridging ----------------------------------------------------------------
bridge_flow_ratio = 1
bridge_angle = 0

# --- skirt / brim / compensation ---------------------------------------------
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 10
# [DELTA] stock 0. One loop is a free flow sanity check on an abrasive material.
brim_type = outer_only
brim_width = 0
brim_separation = 0.1
elefant_foot_compensation = 0.2
xy_size_compensation = 0

# --- supports ----------------------------------------------------------------
support_material = 0
support_material_auto = 1
support_material_threshold = 40
raft_layers = 0

# --- output ------------------------------------------------------------------
arc_fitting = emit_center
gcode_resolution = 0.0125
slice_closing_radius = 0.049
resolution = 0
spiral_vase = 0
complete_objects = 0
ironing = 0
ironing_type = top
ironing_flowrate = 12%
ironing_spacing = 0.2
ironing_speed = 20

notes = "0.25 mm @ 0.6 HF ObXidian, quality-biased. Base: Prusa 0.25mm BALANCED @COREONE HF0.6. Strategy: slow externals (100 vs 180), keep infill at 150 = 87% of the 27 mm3/s cap. Pair with 'Elegoo PLA-CF HFOBX06 @COREONE'."


# -----------------------------------------------------------------------------
# FILAMENT -- base: Prusa "Elegoo PLA @COREONE HF0.6"
# -----------------------------------------------------------------------------
[filament:Elegoo PLA-CF HFOBX06 @COREONE]
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.6 and nozzle_high_flow[0]

filament_vendor = Elegoo
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.26
filament_cost = 24
filament_spool_weight = 160
filament_colour = #3A3A3A
filament_soluble = 0
filament_abrasive = 1

extrusion_multiplier = 0.95
# Prusa uses 1.00 for neat Elegoo PLA. The 0.8 DiamondBack profile landed well
# at 0.95; carry it over as the seed and re-measure.

filament_max_volumetric_speed = 27
# E3D datasheet and Prusa's shipped profile BOTH say 30 for this nozzle with
# neat PLA at 220 C. 27 is a ~10 % derate for CF viscosity. This is the number
# most worth testing -- if 30 holds with CF, the profile above will use it
# immediately with no other change, because infill is already the binding item.

temperature = 230
first_layer_temperature = 235
# Prusa runs neat Elegoo PLA at 220 here but raises Prusament PLA to 230 on the
# HF0.6 specifically -- HF geometry moves more material and needs the thermal
# headroom. CF wants another few degrees on top. If you sustain 25+ mm3/s on
# big infill, go to 235-240; watch for stringing as you climb.
bed_temperature = 55
first_layer_bed_temperature = 60
idle_temperature = 170
chamber_temperature = 20
chamber_minimal_temperature = 0

filament_retract_length = nil
filament_retract_speed = nil
filament_deretract_speed = nil
filament_retract_lift = nil
filament_retract_before_travel = nil
filament_retract_layer_change = nil
filament_retract_restart_extra = nil
filament_wipe = nil
# The "Prusa CORE One HF0.6 nozzle" preset already carries 0.7 mm @ 45 mm/s,
# deretract 25, lift 0.2, ramping travel and wipe. Note this is a longer and
# much faster retract than the 0.8 preset used (0.6 @ 25). Leave it alone until
# a retraction tower says otherwise.

cooling = 1
fan_always_on = 1
min_fan_speed = 85
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
fan_below_layer_time = 40
slowdown_below_layer_time = 15
min_print_speed = 15
enable_dynamic_fan_speeds = 1
overhang_fan_speed_0 = 100
overhang_fan_speed_1 = 100
overhang_fan_speed_2 = 0
overhang_fan_speed_3 = 0

start_filament_gcode = "M572 S{if nozzle_diameter[filament_extruder_id]==0.6}0.014{elsif nozzle_diameter[filament_extruder_id]==0.4}0.020{elsif nozzle_diameter[filament_extruder_id]==0.8}0.010{else}0.014{endif} ; Pressure advance - CF-PLA seed, RECALIBRATE\nM142 S36 ; set heatbreak target temp"
end_filament_gcode = ""

filament_notes = "Elegoo PLA-CF | CORE One + E3D High Flow ObXidian 0.6\n\nFLOW\n  E3D published max volumetric flow, this nozzle, PLA 220 C: 30 mm3/s.\n  Prusa's shipped MVS for Elegoo PLA on HF0.6: also 30 mm3/s.\n  Set here to 27 as a ~10 % CF derate. Test it - if 30 holds, the print\n  profile uses it straight away because infill is already the binding item.\n\n  Standard-flow 0.6 for comparison is 15.5. At 0.6 the HF nozzle is worth\n  nearly 2x on throughput. At 0.8 the same two nozzles were much closer.\n\nWEAR - THE TRADE YOU ARE MAKING\n  ObXidian is a tool-steel insert with E3DLC coating. It is far better than\n  generic hardened steel, but it is not diamond. E3D's own guidance is that\n  aggressively filled materials wear even ObXidian. On a steady diet of CF\n  this nozzle is a consumable; the DiamondBack effectively is not. Watch for\n  the orifice opening up: extrusion width creeping wide, corners going soft,\n  dimensional drift on the outside of parts. Re-run the EM test every few kg\n  and treat a drifting EM as a wear indicator, not a filament problem.\n\nCALIBRATION ORDER (each step invalidates the ones after it)\n  1. TEMPERATURE. Tower 215/220/225/230/235/240 at 0.25 mm. Judge on layer\n     bonding and bridge droop, not gloss - CF is matte regardless.\n  2. EXTRUSION MULTIPLIER. Vase-mode single-wall cube, external width forced\n     to 0.68, 0 top/bottom, 0 infill. Micrometer all four walls.\n     EM_new = EM_old * (0.68 / measured).\n  3. PRESSURE ADVANCE. M572 S sweep 0.008 -> 0.024 in 0.002 steps. Judge on\n     corner bulge and the first ~5 mm after a seam.\n  4. MAX VOLUMETRIC SPEED. Raise 1 mm3/s at a time until walls thin or go\n     translucent, back off 15 %. Test at 235 C, not 230 - you are looking for\n     the melt limit, and undercooking it will give you a pessimistic answer.\n  5. RETRACTION last, and only if you actually see stringing.\n\nDRYING\n  55 C, 4-6 h. Wet CF-PLA presents exactly like a bad profile. Rule it out\n  first, every time.\n\nWHERE THIS PROFILE SPENDS ITS BUDGET\n  External perimeter 100 mm/s where Prusa asks 180. Infill left at 150 mm/s,\n  87 % of cap. You pay for looks on the ~2 mm of wall the eye sees and take\n  the high-flow win on everything behind it."


# #############################################################################
# ##  B)  DIAMONDBACK 0.6  (standard flow)                                   ##
# #############################################################################

# -----------------------------------------------------------------------------
# PRINT -- base: Prusa "0.25mm STRUCTURAL @COREONE 0.6"
# STRUCTURAL, not SPEED, is the right base here: Prusa's own quality-leaning
# 0.6 tier already runs external 50 / perimeter 70 at 1500/2500 accel.
# Strategy: every speed set at or below what MVS will actually allow, so the
# preset is honest and the time estimate is real.
# -----------------------------------------------------------------------------
[print:0.25mm QUALITY DB06 CF @COREONE]
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.6 and ! nozzle_high_flow[0]

# --- layers & shells ---------------------------------------------------------
layer_height = 0.25
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
top_solid_min_thickness = 0.9
bottom_solid_min_thickness = 0.7
perimeter_generator = arachne
ensure_vertical_shell_thickness = 1
seam_position = aligned
staggered_inner_seams = 1
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
overhangs = 1
gap_fill_enabled = 1
avoid_crossing_perimeters = 0

# --- infill ------------------------------------------------------------------
fill_density = 20%
fill_pattern = gyroid
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
solid_infill_every_layers = 0
infill_anchor = 2.5
infill_anchor_max = 20
solid_infill_below_area = 0

# --- extrusion widths --------------------------------------------------------
extrusion_width = 0.68
first_layer_extrusion_width = 0.68
perimeter_extrusion_width = 0.68
external_perimeter_extrusion_width = 0.64
infill_extrusion_width = 0.68
solid_infill_extrusion_width = 0.68
top_infill_extrusion_width = 0.55
support_material_extrusion_width = 0.5

# --- speeds (mm/s) -----------------------------------------------------------
# MVS 14 mm3/s saturates at 89 mm/s with a 0.68 mm bead at 0.25 mm layer.
# EVERY speed below is set under that ceiling on purpose:
#   external perim   50 x 0.1466 =  7.3 mm3/s   52 % of cap
#   perimeter        70 x 0.1566 = 11.0 mm3/s   78 %
#   infill           85 x 0.1566 = 13.3 mm3/s   95 %   <-- at the ceiling
#   solid infill     80 x 0.1566 = 12.5 mm3/s   90 %
#   top solid        50 x 0.1241 =  6.2 mm3/s   44 %
# Prusa's stock 0.6 profiles ask for infill 140, which MVS clips to 89. Setting
# 85 costs nothing real and makes the preview time estimate honest.
perimeter_speed = 70
external_perimeter_speed = 50
small_perimeter_speed = 50
infill_speed = 85
# [DELTA] stock 140 -- which this nozzle cannot do. See above.
solid_infill_speed = 80
# [DELTA] stock 90, also clipped.
top_solid_infill_speed = 50
# [DELTA] stock 60.
first_layer_infill_speed = 70
gap_fill_speed = 60
bridge_speed = 30
support_material_speed = 55
support_material_interface_speed = 85%
travel_speed = 350
travel_speed_z = 12
first_layer_speed = 35
first_layer_speed_over_raft = 30
max_print_speed = 300

# --- dynamic overhang speeds -------------------------------------------------
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 15
overhang_speed_1 = 20
overhang_speed_2 = 30
overhang_speed_3 = 70%

# --- acceleration ------------------------------------------------------------
# Prusa's STRUCTURAL values, essentially unchanged. Input shaping is already
# handling ringing; dropping these further only costs time.
default_acceleration = 3000
perimeter_acceleration = 2500
external_perimeter_acceleration = 1500
infill_acceleration = 5000
# [DELTA] stock 6000. Pointless above the speed MVS allows -- the tool would
# spend the whole move accelerating into a ceiling it cannot cross.
solid_infill_acceleration = 4000
top_solid_infill_acceleration = 2000
bridge_acceleration = 1500
first_layer_acceleration = 500
travel_acceleration = 7000

# --- bridging ----------------------------------------------------------------
bridge_flow_ratio = 1
bridge_angle = 0

# --- skirt / brim / compensation ---------------------------------------------
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 10
brim_type = outer_only
brim_width = 0
brim_separation = 0.1
elefant_foot_compensation = 0.2
xy_size_compensation = 0

# --- supports ----------------------------------------------------------------
support_material = 0
support_material_auto = 1
support_material_threshold = 40
raft_layers = 0

# --- output ------------------------------------------------------------------
arc_fitting = emit_center
gcode_resolution = 0.0125
slice_closing_radius = 0.049
resolution = 0
spiral_vase = 0
complete_objects = 0
# Ironing off. The polished PCD flat already part-irons the top surface -- this
# is the DiamondBack's real cosmetic advantage over the ObXidian and it costs
# you nothing. Turn ironing on only if you want a genuinely flat top.
ironing = 0
ironing_type = top
ironing_flowrate = 12%
ironing_spacing = 0.2
ironing_speed = 20

notes = "0.25 mm @ 0.6 DiamondBack (standard flow), quality-biased. Base: Prusa 0.25mm STRUCTURAL @COREONE 0.6. Every speed set under the 89 mm/s MVS ceiling so nothing is silently throttled. Pair with 'Elegoo PLA-CF DB06 @COREONE'."


# -----------------------------------------------------------------------------
# FILAMENT -- base: Prusa "Elegoo PLA @COREONE 0.6"
# -----------------------------------------------------------------------------
[filament:Elegoo PLA-CF DB06 @COREONE]
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.6 and ! nozzle_high_flow[0]

filament_vendor = Elegoo
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.26
filament_cost = 24
filament_spool_weight = 160
filament_colour = #3A3A3A
filament_soluble = 0
filament_abrasive = 1

extrusion_multiplier = 0.95

filament_max_volumetric_speed = 14
# Prusa ships 15.5 for neat Elegoo PLA on the standard-flow 0.6. 14 is a ~10 %
# CF derate, the same ratio that worked on the 0.8 (18 against Prusa's 19).
# The PCD tip's conductivity may buy a little back -- 15-16 is plausible -- but
# the melt zone upstream is standard geometry, so do not expect HF numbers.

temperature = 230
first_layer_temperature = 235
bed_temperature = 55
first_layer_bed_temperature = 60
idle_temperature = 170
chamber_temperature = 20
chamber_minimal_temperature = 0

filament_retract_length = nil
filament_retract_speed = nil
filament_deretract_speed = nil
filament_retract_lift = nil
filament_retract_before_travel = nil
filament_retract_layer_change = nil
filament_retract_restart_extra = nil
filament_wipe = nil
# "Prusa CORE One 0.6 nozzle" preset carries 0.7 mm @ 45 mm/s, deretract 25,
# lift 0.2, ramping travel, wipe on.

cooling = 1
fan_always_on = 1
min_fan_speed = 85
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
fan_below_layer_time = 40
slowdown_below_layer_time = 15
min_print_speed = 20
enable_dynamic_fan_speeds = 1
overhang_fan_speed_0 = 100
overhang_fan_speed_1 = 100
overhang_fan_speed_2 = 0
overhang_fan_speed_3 = 0

start_filament_gcode = "M572 S{if nozzle_diameter[filament_extruder_id]==0.6}0.014{elsif nozzle_diameter[filament_extruder_id]==0.4}0.020{elsif nozzle_diameter[filament_extruder_id]==0.8}0.010{else}0.014{endif} ; Pressure advance - CF-PLA seed, RECALIBRATE\nM142 S36 ; set heatbreak target temp"
end_filament_gcode = ""

filament_notes = "Elegoo PLA-CF | CORE One + E3D DiamondBack 0.6 (PCD, STANDARD flow)\n\nFLOW\n  Prusa ships 15.5 mm3/s for neat Elegoo PLA on the standard-flow 0.6.\n  Set here to 14 as a ~10 % CF derate - the same ratio that worked on the 0.8.\n  E3D publishes no flow table for the DiamondBack Nextruder nozzle; they\n  publish one only for their HF products. Treat that as the answer: this is a\n  standard-flow part and its value is wear resistance and tip finish.\n\n  For contrast: the HF ObXidian 0.6 is rated 30 mm3/s. At 0.6 the high-flow\n  nozzle is worth close to 2x on throughput. Choose deliberately.\n\nMVS CEILING - THE THING TO INTERNALISE\n  At 0.25 mm layer with a 0.68 mm bead, 14 mm3/s saturates at 89 mm/s. Any\n  speed above that in ANY preset is fiction; PrusaSlicer clips it silently.\n  Prusa's own 0.6 profiles ask for infill 140. The print profile paired with\n  this one sets 85 instead so the numbers mean what they say.\n\n  If you edit speeds, check them against MVS/area first:\n    layer 0.20 -> 110 mm/s ceiling\n    layer 0.25 ->  89 mm/s\n    layer 0.32 ->  72 mm/s\n    layer 0.40 ->  59 mm/s\n\nCLEANING - E3D'S EXPLICIT GUIDANCE FOR THIS NOZZLE\n  DO:     nylon cleaning filament, warm pull, cold pull, brass brush\n  DO NOT: needle, steel wire brush, blow torch\n  PCD is the hardest material in the tip but it is brittle at an edge, and a\n  torch will degrade the diamond-to-diamond binder. A steel brush will not\n  scratch the diamond but will damage the brass carrier around it.\n\nCALIBRATION ORDER (each step invalidates the ones after it)\n  1. TEMPERATURE. Tower 215/220/225/230/235/240 at 0.25 mm.\n  2. EXTRUSION MULTIPLIER. Vase-mode single-wall cube, external width forced\n     to 0.68. EM_new = EM_old * (0.68 / measured).\n  3. PRESSURE ADVANCE. M572 S sweep 0.008 -> 0.024 in 0.002 steps.\n  4. MAX VOLUMETRIC SPEED. Raise 1 mm3/s at a time from 14. Because this\n     nozzle saturates at 89 mm/s, an MVS gain here translates directly into\n     infill speed - it is worth the print.\n  5. RETRACTION last, and only if you see stringing.\n\nDRYING\n  55 C, 4-6 h. Wet CF-PLA presents exactly like a bad profile.\n\nWEAR\n  The PCD tip will effectively not wear on CF. Everything upstream still can:\n  the Nextruder drive gear and any PTFE in the filament path. If extrusion\n  quality degrades on this nozzle, look upstream before you blame the tip."

