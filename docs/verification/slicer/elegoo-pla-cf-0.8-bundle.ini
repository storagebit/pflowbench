# =============================================================================
# PrusaSlicer Config Bundle  --  v2 (rebased on Prusa's tested vendor profiles)
#
#   Filament : Elegoo PLA-CF (carbon-fibre filled PLA, 1.75 mm)
#   Printer  : Prusa CORE One / CORE One L, preset "Prusa CORE One 0.8 nozzle"
#   Nozzle   : E3D DiamondBack Nextruder 0.8 mm  (PCD tip, STANDARD flow)
#   Print    : 0.40 mm layer, quality-biased
#
# IMPORT:   PrusaSlicer -> File -> Import -> Import Config Bundle...
# REQUIRES: PrusaSlicer 2.9.x+
#
# PROVENANCE
#   Every value below is either (a) taken verbatim from Prusa's own
#   "0.40mm QUALITY @COREONE 0.8" and "Elegoo PLA @COREONE 0.8" presets in
#   resources/profiles/PrusaResearch.ini, or (b) an explicit CF/quality delta.
#   Deltas are marked  [DELTA]  with the stock value and the reason.
#
#   Prusa already ships "0.40mm QUALITY @COREONE 0.8" -- if you would rather not
#   import a print preset, select that one and apply the [DELTA] lines by hand.
#
# THE ONE THING THAT MATTERS MOST
#   CORE One sets pressure advance with  M572 S<val>, NOT  M900 K<val>.
#   Prusa's start G-code branches on printer_notes: MK4IS/XLIS/MK4S/MK3.9S/
#   COREONE take the M572 branch, everything older takes the legacy M900 branch.
#   The two are on different scales -- for a 0.4 nozzle with Elegoo PLA, Prusa
#   ships M900 K0.035 for legacy boards and M572 S0.020 for this one. A K value
#   is not an S value, so a PA number copied from an MK3-era profile is wrong
#   even if the command is accepted.
# =============================================================================


# -----------------------------------------------------------------------------
# PRINT PROFILE
# -----------------------------------------------------------------------------
[print:0.40mm QUALITY DB08 CF @COREONE]
# Same gating Prusa uses for its standard-flow 0.8 profiles, widened to cover
# CORE One, CORE One L, OAK and MMU3 variants. nozzle_high_flow[0] is the real
# discriminator -- this preset must NOT attach to an HF nozzle.
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.8 and ! nozzle_high_flow[0]

# --- layers & shells ---------------------------------------------------------
layer_height = 0.4
first_layer_height = 0.2
perimeters = 3
# [DELTA] stock 2. Third wall at 0.9 mm = 2.7 mm shell. CF-PLA is stiff but
# brittle; walls carry load far better than infill density does.
top_solid_layers = 4
bottom_solid_layers = 3
top_solid_min_thickness = 1.2
bottom_solid_min_thickness = 0.8
perimeter_generator = arachne
ensure_vertical_shell_thickness = 1
seam_position = aligned
# [DELTA] stock "nearest". A 0.9 mm bead makes a big seam; aligning it into one
# column is far less ugly than scattering it. Paint the seam on cosmetic parts.
staggered_inner_seams = 1
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
overhangs = 1
gap_fill_enabled = 1
avoid_crossing_perimeters = 0

# --- infill ------------------------------------------------------------------
fill_density = 20%
# [DELTA] stock 15%.
fill_pattern = gyroid
# [DELTA] stock rectilinear. At 7000 mm/s2 infill accel and a 0.33 mm2 bead,
# gyroid's continuous curvature keeps melt pressure steadier than rectilinear's
# full stop at every turn. Also isotropic, which suits CF's anisotropy.
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
solid_infill_every_layers = 0
infill_anchor = 2.5
infill_anchor_max = 20
solid_infill_below_area = 0

# --- extrusion widths --------------------------------------------------------
extrusion_width = 0.9
first_layer_extrusion_width = 1
perimeter_extrusion_width = 0.9
external_perimeter_extrusion_width = 0.85
# [DELTA] stock 0.9. Narrower external bead = crisper corners and tighter
# outside dimensions. This is the one cosmetic gamble in the file: if you see
# gaps or starved corners on the outer wall, put it back to 0.9.
infill_extrusion_width = 0.9
solid_infill_extrusion_width = 0.9
top_infill_extrusion_width = 0.75
support_material_extrusion_width = 0.6

# --- speeds (mm/s) -----------------------------------------------------------
# These are ceilings. filament_max_volumetric_speed does the real throttling.
# Flow at 0.40 mm layer, against filament_max_volumetric_speed = 18:
#   external perim  0.85w -> 0.306 mm2 @ 35 = 10.7 mm3/s
#   perimeter       0.90w -> 0.326 mm2 @ 50 = 16.3 mm3/s   (headroom is thin)
#   solid infill    0.90w -> 0.326 mm2 @ 45 = 14.7 mm3/s
#   sparse infill   0.90w -> 0.326 mm2 @ 90 = 29.3 -> MVS-throttled to ~55 mm/s
#   top solid       0.75w -> 0.266 mm2 @ 35 =  9.3 mm3/s
#   first layer     1.00w -> 0.191 mm2 @ 35 =  6.7 mm3/s
perimeter_speed = 50
external_perimeter_speed = 35
# [DELTA] stock 45. Buys wall finish; costs little since externals are a small
# share of a big-nozzle print.
small_perimeter_speed = 35
infill_speed = 90
solid_infill_speed = 45
top_solid_infill_speed = 35
first_layer_infill_speed = 55
gap_fill_speed = 35
bridge_speed = 22
support_material_speed = 50
support_material_interface_speed = 85%
travel_speed = 350
travel_speed_z = 12
first_layer_speed = 35
# [DELTA] stock 45. CF on glue-sticked smooth PEI; slower first layer is cheap.
first_layer_speed_over_raft = 30
max_print_speed = 300

# --- dynamic overhang speeds -------------------------------------------------
# This is the single biggest quality feature for a 0.8 nozzle and it is ON in
# Prusa's stock profile. It is what keeps overhangs survivable at 0.4 mm layers.
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 15
overhang_speed_1 = 20
overhang_speed_2 = 35
overhang_speed_3 = 80%

# --- acceleration ------------------------------------------------------------
# Prusa's tested CoreXY values. Input shaping is already handling ringing;
# gratuitously low accel here just costs time without buying quality.
default_acceleration = 3000
perimeter_acceleration = 2500
external_perimeter_acceleration = 1200
# [DELTA] stock 1500. Small reduction on the only extrusion the eye sees.
infill_acceleration = 7000
solid_infill_acceleration = 5000
top_solid_infill_acceleration = 2000
bridge_acceleration = 1000
first_layer_acceleration = 500
travel_acceleration = 7000

# --- bridging ----------------------------------------------------------------
bridge_flow_ratio = 1
bridge_angle = 0
# If bridges sag, drop bridge_flow_ratio to 0.85-0.90 before touching anything
# else. Stock is 1 and it is tested, so it stays 1 here.

# --- skirt / brim / compensation ---------------------------------------------
skirts = 1
skirt_distance = 3
skirt_height = 1
min_skirt_length = 10
# [DELTA] stock skirts = 0. CORE One does its own purge line, but one skirt
# loop of 10 mm filament is a free flow sanity check with an abrasive material.
brim_type = outer_only
brim_width = 0
brim_separation = 0.1
elefant_foot_compensation = 0.2
xy_size_compensation = 0

# --- supports ----------------------------------------------------------------
support_material = 0
support_material_auto = 1
support_material_threshold = 40
raft_layers = 0

# --- output ------------------------------------------------------------------
arc_fitting = emit_center
gcode_resolution = 0.0125
slice_closing_radius = 0.049
resolution = 0
spiral_vase = 0
complete_objects = 0

# Ironing off. The DiamondBack's polished PCD flat already part-irons the top
# surface. Turn on only if you want a genuinely flat top and can spend the time.
ironing = 0
ironing_type = top
ironing_flowrate = 12%
ironing_spacing = 0.25
ironing_speed = 20

notes = "0.40 mm @ 0.8 mm DiamondBack (standard flow), quality-biased. Rebased on Prusa 0.40mm QUALITY @COREONE 0.8. Deltas: 3 perimeters, 20% gyroid, external width 0.85, external speed 35, first layer 35, aligned seam, skirt on, external accel 1200."


# -----------------------------------------------------------------------------
# FILAMENT PROFILE - Elegoo PLA-CF
#
# Baseline is Prusa's own "Elegoo PLA @COREONE 0.8" preset, adjusted for the CF
# grade. Elegoo's PLA-CF envelope is 210-240 C nozzle / 35-65 C bed / dry 55 C.
# -----------------------------------------------------------------------------
[filament:Elegoo PLA-CF DB08 @COREONE]
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.8 and ! nozzle_high_flow[0]

# --- identity ----------------------------------------------------------------
filament_vendor = Elegoo
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.26
filament_cost = 24
filament_spool_weight = 160
filament_colour = #3A3A3A
filament_soluble = 0
filament_abrasive = 1
# Prusa uses this flag on all of its filled/abrasive presets. It does not
# change G-code. Prusa never sets nozzle_hrc on CORE One presets, so it should
# not nag you -- and with a PCD tip the warning would be meaningless anyway.

# --- flow --------------------------------------------------------------------
extrusion_multiplier = 0.95
# Prusa uses 1.00 for plain Elegoo PLA. CF grades typically land 0.94-0.98
# because the fibre loading changes effective density. MEASURE IT.

filament_max_volumetric_speed = 18
# Prusa's tested value for plain Elegoo PLA on this exact nozzle is 19. CF
# raises melt viscosity; running 10 C hotter than Prusa's profile buys most of
# that back. 18 leaves perimeters (16.3 mm3/s) just under the ceiling. Expect
# the real limit to land 17-21 once you test it.

# --- temperature -------------------------------------------------------------
temperature = 230
first_layer_temperature = 235
# Prusa runs plain Elegoo PLA at 220 / 230. CF wants +5-10 C, and a 0.8 orifice
# at 15+ mm3/s wants the headroom. The PCD tip conducts heat far better than
# brass, so once tuned you may well walk this back toward 220-225.
bed_temperature = 55
first_layer_bed_temperature = 60
# [DELTA] Prusa runs 60/60. Dropping to 55 after layer one keeps chamber temp
# down, which matters for PLA in a closed CORE One. Revert to 60 if adhesion
# suffers on tall or thin-footprint parts.
idle_temperature = 170
chamber_temperature = 20
chamber_minimal_temperature = 0
# chamber_minimal_temperature = 0 makes Prusa's start G-code emit "M870 O",
# i.e. VENT FLAP OPEN. Mandatory for PLA in an enclosure. Do not change this.

# --- retraction --------------------------------------------------------------
# Deliberately nil. The "Prusa CORE One 0.8 nozzle" printer preset already
# carries 0.6 mm @ 25 mm/s, deretract 15, lift 0.25 with ramping travel and
# wipe enabled -- all sized for this nozzle. Only override after a retraction
# tower proves there is a problem.
filament_retract_length = nil
filament_retract_speed = nil
filament_deretract_speed = nil
filament_retract_lift = nil
filament_retract_before_travel = nil
filament_retract_layer_change = nil
filament_retract_restart_extra = nil
filament_wipe = nil

# --- cooling -----------------------------------------------------------------
# Prusa's tested Elegoo PLA cooling on CORE One, unchanged. Note min_fan_speed
# is 85, not 100 -- inside a closed chamber that is already plenty, and the
# extra 15% would cost layer adhesion that CF-PLA cannot spare.
cooling = 1
fan_always_on = 1
min_fan_speed = 85
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
fan_below_layer_time = 40
slowdown_below_layer_time = 17
min_print_speed = 20
enable_dynamic_fan_speeds = 1
overhang_fan_speed_0 = 100
overhang_fan_speed_1 = 100
overhang_fan_speed_2 = 0
overhang_fan_speed_3 = 0

# --- custom G-code -----------------------------------------------------------
# M572 S = pressure advance on CORE One / MK4S / MK3.9S / XL. M900 K is the
# legacy path Prusa uses only for older boards, and it is on a different scale.
# M142 S36 = heatbreak target temperature. Prusa sets this on every CORE One
# PLA profile. Omitting it removes heatbreak thermal regulation and invites
# heat creep when printing PLA in a hot enclosure. Keep it.
# 0.010 is Prusa's tested PA for a 0.8 nozzle with Elegoo PLA. CF usually wants
# slightly less. Sweep it.
start_filament_gcode = "M572 S{if nozzle_diameter[filament_extruder_id]==0.8}0.010{elsif nozzle_diameter[filament_extruder_id]==0.6}0.014{elsif nozzle_diameter[filament_extruder_id]==0.4}0.020{else}0.010{endif} ; Pressure advance - CF-PLA seed, RECALIBRATE\nM142 S36 ; set heatbreak target temp"
end_filament_gcode = ""

filament_notes = "Elegoo PLA-CF | Prusa CORE One + E3D DiamondBack 0.8 mm (PCD, STANDARD flow)\n\nBASELINE\n  Derived from Prusa's own 'Elegoo PLA @COREONE 0.8' and '0.40mm QUALITY\n  @COREONE 0.8' presets, adjusted for the CF grade. Where this profile differs\n  from Prusa's tested values the reason is in the .ini comments.\n\nVENDOR ENVELOPE (Elegoo PLA-CF)\n  Nozzle 210-240 C | Bed 35-65 C | Dry 55 C | Hardened nozzle required\n  1.75 mm +/- 0.02 | print speed rated to 300 mm/s\n\nPRINTER PRESET\n  Use 'Prusa CORE One 0.8 nozzle' (nozzle_high_flow = 0).\n  NOT the HF0.8 preset. E3D and Prusa both state the DiamondBack Nextruder\n  nozzle uses standard-flow internal geometry, so the HF profile's ~37 mm3/s\n  ceiling does not apply and will generate G-code the hotend cannot feed.\n\nBEFORE THE FIRST PRINT\n  1. Dry the spool: 55 C, 4-6 h. Wet CF-PLA presents exactly like a bad\n     profile - popping, fuzzy walls, weak layers. Rule this out first.\n  2. Confirm the standard 0.8 printer preset is selected.\n  3. Smooth PEI + purple glue stick, or textured PEI bare.\n\nCALIBRATION ORDER (each step invalidates the ones after it)\n  1. TEMPERATURE. Tower 215/220/225/230/235/240 at 0.4 mm layers. Judge layer\n     bonding and bridge droop, not gloss - CF is matte regardless. Expect to\n     land below where a brass nozzle would sit; the PCD tip conducts better.\n  2. EXTRUSION MULTIPLIER. Single-wall vase cube, external width forced to\n     0.90, 0 top/bottom, 0 infill. Micrometer all four walls.\n     EM_new = EM_old * (0.90 / measured). Start 0.95.\n  3. PRESSURE ADVANCE. M572 S sweep 0.004 -> 0.020 in 0.002 steps. Judge on\n     corner bulge and the first ~5 mm after a seam. Edit start_filament_gcode.\n     M900 K DOES NOTHING ON THIS PRINTER - do not waste a print on it.\n  4. MAX VOLUMETRIC SPEED. Raise filament_max_volumetric_speed 1 mm3/s at a\n     time until walls thin or go translucent, then back off 15 %.\n  5. RETRACTION last, and only if you actually see stringing.\n\nWHAT 0.4 mm LAYER / 0.8 mm NOZZLE COSTS YOU\n  - Overhangs past ~50 deg and bridges over ~30 mm are materially worse than\n    a 0.4 nozzle. Dynamic overhang speeds (on in the print profile) are what\n    keeps this tolerable - do not disable them.\n  - Arachne will merge or drop features below roughly 1.7 mm wall thickness.\n    Check the preview, not the model.\n  - The Z seam is a 0.9 mm bead. seam_position = aligned plus a painted seam\n    on cosmetic parts is worth the two minutes.\n  - CF's matte finish hides layer lines well, which flatters this layer height.\n\nSTRENGTH VS LOOKS\n  CF-PLA is stiffer and more brittle than neat PLA; Z is the weak axis. For\n  load-bearing parts: +5 C, drop min_fan_speed to 60, and add perimeters\n  rather than infill density.\n\nMAINTENANCE\n  The PCD tip will not wear. Everything upstream of it still can - CF abrades\n  the Nextruder drive gear and any PTFE in the path. Inspect periodically."

