# EM flow-cube print presets - derived from the 0.6 quality presets with:
#   perimeters 1, top 0, infill 0%, bottom 3, classic perimeter generator.
# Import as a Config Bundle alongside the main profile file.
# Slice EM_flow_cube_40x40.stl with the preset matching the installed nozzle;
# filament preset stays the normal Elegoo PLA-CF one for that nozzle.
[print:EM FLOW CUBE HFOBX06 @COREONE]
compatible_printers_condition = printer_model=~/(COREONE|COREONEL|COREONEOAK|COREONEMMU3|COREONELMMU3)/ and nozzle_diameter[0]==0.6 and nozzle_high_flow[0]
layer_height = 0.25
first_layer_height = 0.2
perimeters = 1
top_solid_layers = 0
bottom_solid_layers = 3
top_solid_min_thickness = 0
bottom_solid_min_thickness = 0.6
perimeter_generator = classic
ensure_vertical_shell_thickness = 1
seam_position = aligned
staggered_inner_seams = 1
external_perimeters_first = 0
extra_perimeters = 0
extra_perimeters_on_overhangs = 0
thin_walls = 0
overhangs = 1
gap_fill_enabled = 1
avoid_crossing_perimeters = 0
fill_density = 0%
fill_pattern = gyroid
top_fill_pattern = monotoniclines
bottom_fill_pattern = monotonic
fill_angle = 45
infill_every_layers = 1
solid_infill_every_layers = 0
infill_anchor = 2.5
infill_anchor_max = 20
solid_infill_below_area = 0
extrusion_width = 0.68
first_layer_extrusion_width = 0.68
perimeter_extrusion_width = 0.68
external_perimeter_extrusion_width = 0.64
infill_extrusion_width = 0.68
solid_infill_extrusion_width = 0.68
top_infill_extrusion_width = 0.55
support_material_extrusion_width = 0.5
perimeter_speed = 130
external_perimeter_speed = 100
small_perimeter_speed = 90
infill_speed = 150
solid_infill_speed = 130
top_solid_infill_speed = 50
first_layer_infill_speed = 70
gap_fill_speed = 70
bridge_speed = 30
support_material_speed = 60
support_material_interface_speed = 85%
travel_speed = 350
travel_speed_z = 12
first_layer_speed = 35
first_layer_speed_over_raft = 30
max_print_speed = 300
enable_dynamic_overhang_speeds = 1
overhang_speed_0 = 15
overhang_speed_1 = 20
overhang_speed_2 = 30
overhang_speed_3 = 70%
default_acceleration = 3000
perimeter_acceleration = 3000
external_perimeter_acceleration = 1800
infill_acceleration = 5000
solid_infill_acceleration = 5000
top_solid_infill_acceleration = 2000
bridge_acceleration = 1500
first_layer_acceleration = 500
travel_acceleration = 7000
bridge_flow_ratio = 1
bridge_angle = 0
skirts = 2
skirt_distance = 3
skirt_height = 1
min_skirt_length = 15
brim_type = outer_only
brim_width = 0
brim_separation = 0.1
elefant_foot_compensation = 0.2
xy_size_compensation = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 40
raft_layers = 0
arc_fitting = emit_center
gcode_resolution = 0.0125
slice_closing_radius = 0.049
resolution = 0
spiral_vase = 0
complete_objects = 0
ironing = 0
ironing_type = top
ironing_flowrate = 12%
ironing_spacing = 0.2
ironing_speed = 20
notes = "EM flow cube preset. Single external perimeter at 0.64 mm; measure mid-wall 12-25 mm up, avoid seam/corners. Target 0.64. EM_new = EM_old * 0.64 / measured."

